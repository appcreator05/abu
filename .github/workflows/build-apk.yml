name: Professional Release APK Builder

on:
  repository_dispatch:
    types: [build_website_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject User Configurations
        run: |
          APP_TITLE="${{ github.event.client_payload.app_title }}"
          PKG_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"

          echo "Building Release APK for: $APP_TITLE ($PKG_NAME) -> $APP_URL"

          # Update app name in strings.xml
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_TITLE</string>|g" app/src/main/res/values/strings.xml
          fi

          # Update URL in MainActivity.java
          find app/src/main/java -name "MainActivity.java" -type f -exec sed -i "s|https://yourblogname.blogspot.com|$APP_URL|g" {} +

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: real-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
